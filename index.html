<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Conheça My Dress-Up Dungeon, o novo jogo em desenvolvimento pela Sopro Lúdico. Acompanhe o projeto na Steam (Em breve) e no itch.io." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="author" content="Sopro Lúdico" />
  <meta name="application-name" content="Sopro Lúdico" />
  <meta name="theme-color" content="#fff8ef" />
  <title>Sopro Lúdico | My Dress-Up Dungeon</title>
  <link rel="canonical" href="/" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sopro Lúdico" />
  <meta property="og:title" content="Sopro Lúdico | My Dress-Up Dungeon" />
  <meta property="og:description"
    content="Conheça My Dress-Up Dungeon, o novo jogo em desenvolvimento pela Sopro Lúdico." />
  <meta property="og:url" content="/" />
  <meta property="og:image" content="assets/game-cover.png" />
  <meta property="og:image:alt" content="Arte de My Dress-Up Dungeon" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:locale:alternate" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sopro Lúdico | My Dress-Up Dungeon" />
  <meta name="twitter:description"
    content="Conheça My Dress-Up Dungeon, o novo jogo em desenvolvimento pela Sopro Lúdico." />
  <meta name="twitter:image" content="assets/game-cover.png" />
  <meta name="twitter:image:alt" content="Arte de My Dress-Up Dungeon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "/#organization",
            "name": "Sopro Lúdico",
            "url": "/",
            "logo": "assets/logo.svg",
            "description": "Estúdio independente de desenvolvimento de jogos."
          },
          {
            "@type": "VideoGame",
            "@id": "/#my-dress-up-dungeon",
            "name": "My Dress-Up Dungeon",
            "description": "Jogo em desenvolvimento pela Sopro Lúdico.",
            "image": "assets/game-cover.png",
            "inLanguage": ["pt-BR", "en"],
            "author": { "@id": "/#organization" },
            "publisher": { "@id": "/#organization" }
          },
          {
            "@type": "WebSite",
            "@id": "/#website",
            "url": "/",
            "name": "Sopro Lúdico",
            "publisher": { "@id": "/#organization" },
            "inLanguage": ["pt-BR", "en"]
          }
        ]
      }
    </script>
</head>

<body>
  <main class="page-shell">
    <header class="studio-header">
      <a class="brand" href="/" aria-label="Sopro Lúdico">
        <!-- <img class="brand-mark" src="assets/logo.svg" alt="" /> -->
        <img class="brand-type" src="assets/logotipo.svg" alt="Sopro Lúdico" />
      </a>
      <div class="language-switcher" role="group" aria-label="Selecionar idioma" data-i18n-aria="languageSelector">
        <button class="language-button" type="button" data-language="pt" aria-pressed="true">PT</button>
        <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section class="content" aria-label="Links do estúdio" data-i18n-aria="studioLinks">
      <article class="featured-game">
        <div class="game-copy">
          <span class="eyebrow"><i></i> <span data-i18n="development">Em desenvolvimento</span></span>
          <div>
            <h1>My <br>Dress-Up <br>Dungeon</h1>
            <p data-i18n="gameDescription">
              Acompanhe o desenvolvimento e adicione à sua lista de desejos.
            </p>
          </div>
          <div class="game-actions">
            <!-- Substituir # pelas páginas do jogo -->
            <a class="button button-primary" href="#" aria-label="Ver o jogo na Steam (Em breve)"
              data-i18n-aria="gameOnSteam">
              <span class="link-label">
                <svg class="platform-icon" aria-hidden="true">
                  <use href="#icon-steam" />
                </svg>
                <span data-i18n="steamComingSoon">Steam (Em breve)</span>
              </span>
              <span aria-hidden="true">↗</span>
            </a>
            <a class="button button-secondary" href="https://soproludico.itch.io/my-dress-up-dungeon"
              aria-label="Ver o jogo no itch.io" data-i18n-aria="gameOnItch">
              <span class="link-label">
                <svg class="platform-icon" aria-hidden="true">
                  <use href="#icon-itch" />
                </svg>
                itch.io
              </span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
        <div class="game-art">
          <img src="assets/game-cover.png" alt="Arte de My Dress-Up Dungeon" data-i18n-alt="gameArtAlt" />
        </div>
      </article>

      <nav class="social-links" aria-label="Redes sociais" data-i18n-aria="socialNetworks">
        <!-- Substituir # pelos links reais das redes sociais -->
        <a class="social-link" href="https://www.instagram.com/soproludico/" aria-label="Instagram do Sopro Lúdico"
          data-i18n-aria="instagramLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-instagram" />
            </svg>
            Instagram
          </span>
          <i>↗</i>
        </a>
        <a class="social-link" href="https://x.com/soproludico" aria-label="X ou Twitter do Sopro Lúdico"
          data-i18n-aria="twitterLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-x" />
            </svg>
            Twitter / X
          </span>
          <i>↗</i>
        </a>
        <a class="social-link" href="https://bsky.app/profile/soproludico.bsky.social"
          aria-label="Bluesky do Sopro Lúdico" data-i18n-aria="blueskyLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-bluesky" />
            </svg>
            Bluesky
          </span>
          <i>↗</i>
        </a>
        <a class="social-link" href="https://www.facebook.com/soproludico" aria-label="Facebook do Sopro Lúdico"
          data-i18n-aria="facebookLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-facebook" />
            </svg>
            Facebook
          </span>
          <i>↗</i>
        </a>
        <a class="social-link" href="#" aria-label="Página do Sopro Lúdico na Steam (Em breve)"
          data-i18n-aria="steamLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-steam" />
            </svg>
            <span data-i18n="steamComingSoon">Steam (Em breve)</span>
          </span>
          <i>↗</i>
        </a>
        <a class="social-link" href="https://soproludico.itch.io/" aria-label="Página do Sopro Lúdico no itch.io"
          data-i18n-aria="itchLabel">
          <span class="link-label">
            <svg class="platform-icon" aria-hidden="true">
              <use href="#icon-itch" />
            </svg>
            itch.io
          </span>
          <i>↗</i>
        </a>
      </nav>
    </section>

    <footer>
      <span>© <span id="year"></span> Sopro Lúdico</span>
    </footer>
  </main>

  <!-- Biblioteca local de ícones das plataformas. -->
  <svg class="icon-library" aria-hidden="true">
    <symbol id="icon-instagram" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="17.4" cy="6.7" r="1.2" fill="currentColor" />
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path
        d="M5 4h4.3l3.6 5.1L17.3 4H20l-5.9 6.9L20.5 20h-4.3l-4-5.7L7.3 20H4.6l6.4-7.5L5 4Zm3.1 2 9.1 12h1.2L9.3 6H8.1Z"
        fill="currentColor" />
    </symbol>
    <symbol id="icon-bluesky" viewBox="-1 -1 28 28">
      <path
        d="M12 10.7c-.8-1.6-3.1-4.6-5.3-6.1C4.6 3.2 3.8 3.5 3.3 3.7 2.8 4 2.7 5 2.7 5.6c0 .7.4 5.7.7 6.5.9 3 4 4 6.8 3.5-4.9.8-6.2 3.4-3.5 6 5.1 5.2 7.1-1.1 7.6-2.8.5 1.7 2.1 7.9 7.3 2.8 2.7-2.7 1.4-5.3-3.5-6 2.8.4 5.9-.6 6.8-3.5.3-.8.7-5.8.7-6.5 0-.7-.1-1.6-.6-1.9-.5-.2-1.3-.5-3.4.9-2.2 1.5-4.5 4.5-5.3 6.1Z"
        fill="currentColor" />
    </symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24">
      <path
        d="M14 8.5V7c0-.8.5-1 1-1h2.8V2.1C17.3 2 16.2 2 14.7 2 11.6 2 9.5 3.9 9.5 7.4v1.1H6V13h3.5v9H14v-9h3.4l.6-4.5H14Z"
        fill="currentColor" />
    </symbol>
    <symbol id="icon-itch" viewBox="0 0 24 24">
      <path
        d="M4.2 4 2.5 7.1v2.1c0 1 .6 1.8 1.5 2.1v7.2c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5v-7.2c.9-.3 1.5-1.1 1.5-2.1V7.1L19.8 4H4.2Zm3.1 9.2c.7 0 1.3.4 1.6 1 .8-.4 1.9-.6 3.1-.6s2.3.2 3.1.6c.3-.6.9-1 1.6-1 1.1 0 2 .9 2 2 0 .8-.5 1.5-1.2 1.8-.3.1-.8 0-1.1-.3-.9.5-2.6.8-4.4.8s-3.5-.3-4.4-.8c-.3.3-.8.4-1.1.3-.7-.3-1.2-1-1.2-1.8 0-1.1.9-2 2-2Z"
        fill="currentColor" />
    </symbol>
    <symbol id="icon-steam" viewBox="0 0 24 24">
      <path
        d="M12 2a10 10 0 0 0-9.8 8l5.4 2.2a3 3 0 0 1 1.9-.7l2.4-3.4A4.2 4.2 0 1 1 16 13.3l-3.8 2.6a3 3 0 0 1-5.8-.4l-3.8-1.6A10 10 0 1 0 12 2Zm4 4.2a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4ZM9.3 13.4a1.8 1.8 0 0 0-.7.1l1 .4c.9.4 1.3 1.4.9 2.3-.4.9-1.4 1.3-2.3.9l-.9-.4a1.9 1.9 0 1 0 2-3.3Z"
        fill="currentColor" />
    </symbol>
  </svg>

  <script src="script.js"></script>
</body>

</html>
